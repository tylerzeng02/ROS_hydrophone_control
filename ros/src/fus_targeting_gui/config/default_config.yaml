# fus_targeting_gui configuration.
#
# The "robot:" block is the only thing that should need to change to
# point this app at a different, already-calibrated MoveIt-configured
# arm. Nothing in fus_targeting_gui's own .py files should ever hardcode
# a frame or group name. Values below match this repo's current Cyton
# Gamma 1500 setup (ros/src/cyton_moveit_config/config/*.yaml, *.srdf).

robot:
  planning_group: arm
  base_frame: base_link
  end_effector_frame: virtual_endeffector
  # Joint names, in the order MoveIt and ros2_control expect them.
  # Matches cyton_hardware's kJointNames and the URDF's ros2_control
  # joint list.
  joint_names:
    - shoulder_roll_joint
    - shoulder_pitch_joint
    - shoulder_yaw_joint
    - elbow_pitch_joint
    - elbow_yaw_joint
    - wrist_pitch_joint
    - wrist_roll_joint

mesh:
  # Absolute path to the skull mesh (STL or PLY). Overridable from the
  # GUI's File > Open Mesh menu at runtime. This is just the startup
  # default.
  default_path: /home/temp/CT5_DICOM_skull_mesh_decimated.stl
  # Uniform scale applied after loading. 0.001 is correct for a mesh
  # authored in millimeters, matching publish_skull_marker.py's own
  # default and warning about this.
  scale: 0.001

# Fixed mesh-local to base_frame registration transform. Same convention
# and same values as publish_skull_marker.py's xyz and rpy arguments,
# which is this mesh's already-known-good placement relative to the
# robot. Keep these two files' values in sync if either is ever
# re-registered.
registration:
  xyz_m: [-0.17, 0.02, 0.15]
  rpy_rad: [3.14159, 0.0, 0.0]

targeting:
  # Distance in mm the probe stops short of the picked surface point
  # along the approach vector, before any final closer approach is done
  # manually or by a future extension. This keeps the very first planned
  # move from driving the probe tip directly into the mesh surface.
  standoff_mm: 10.0
  # Planning and execution tuning. See
  # cyton_pose_commander/src/pose_commander.cpp for why these particular
  # values are used: elbow_yaw's narrow locked window needs a larger
  # time budget and more attempts than MoveIt's defaults.
  planning_time_s: 30.0
  num_planning_attempts: 15
