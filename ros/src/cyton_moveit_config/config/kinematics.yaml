# IK solver for the "arm" planning group.
#
# Using KDLKinematicsPlugin (ships with moveit_kinematics, zero extra build
# risk) rather than trac_ik_kinematics_plugin, even though external/trac_ik
# is populated in this checkout (references/cyton_gamma_1500_trac_ik.urdf's
# own filename was chosen with trac_ik in mind) -- CLAUDE.md flagged this as
# an open decision rather than assuming trac_ik. KDL is the documented
# fallback and is what's actually validated working here (see the demo
# launch sanity check). Swapping in TRAC-IK later is a one-line change:
#
#   kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
#
# (plus building trac_ik_kinematics_plugin into this workspace, which
# hasn't been done/tested here).
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
