# IK solver for the "arm" planning group -- this is the KDL variant (the
# production default). See kinematics_trac_ik.yaml for the TRAC-IK variant
# (cyton_trac_ik_kinematics_plugin, a fresh MoveIt2-native
# plugin wrapping external/trac_ik's core solver -- NOT the old ROS1
# trac_ik_kinematics_plugin this comment used to reference, which can't
# build in ROS2 at all). Select between them via demo.launch.py's
# ik_solver:=kdl|trac_ik argument (default kdl -- TRAC-IK is brand new and
# not yet hardware-validated; see that plugin's own header comment).
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
